name: Olist CI

on:
  push:

  pull_request:
    branches:
      - main


jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: set up java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.13"

      - name: install dependencies
        run: pip install -r requirements.txt
        
      - name: Run tests
        run: python -m pytest -q tests/test_transformation.py tests/test_validation.py tests/test_curation.py tests/test_pipeline_integration.py


  airflow-tests:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install Airflow
        run: |
          pip install "apache-airflow==3.3.2" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.13.txt"
      
      - name: Install project test dependencies
        run: pip install -r requirements.txt

      
      - name: Install Databricks Provider
        run: pip install "apache-airflow-providers-databricks==7.22.0"

      
      - name: Run Airflow DAG tests
        run: python -m pytest -q tests/test_olist_dag.py tests/test_olist_azure_dag.py
  

  
  