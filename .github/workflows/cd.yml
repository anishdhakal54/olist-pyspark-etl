name: Olist CD


on:
  workflow_run:
    workflows: ["Olist CI"]
    types:
      - completed
    branches:
      - main

jobs:
  prepare-deployment:
    if: ${{ github.event.workflow_run.conclusion =='success'}}
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment preparation
        run: echo "CI passed. Prepare Olist deployment."
  
  deploy-production:
    needs: prepare-deployment
    runs-on: ubuntu-latest
    environment: production 

    steps:
      - name: Simulate production deployment
        run: echo "Deploying Olist pipeline to production."
