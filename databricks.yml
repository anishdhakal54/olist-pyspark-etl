bundle:
  name: olist-data-engineering


variables:
  storage_account:
    default: stolistdev54

  container:
    default: olist

  task_max_retries:
    default: 2

  task_retry_interval_ms:
    default: 120000


resources:
  jobs:

    # ========================================================
    # ONE-TIME SIMULATED SOURCE PREPARATION
    # ========================================================

    prepare_simulated_source:
      name: olist-prepare-simulated-source

      tasks:
        - task_key: prepare_source
          job_cluster_key: source_prep_cluster

          notebook_task:
            notebook_path: ./databricks/00_prepare_simulated_source.py
            base_parameters:
              storage_account: ${var.storage_account}
              container: ${var.container}
      job_clusters:
        - job_cluster_key: source_prep_cluster
          new_cluster:
            spark_version: 18.x-scala2.13
            node_type_id: Standard_E4ads_v6
            data_security_mode: DATA_SECURITY_MODE_STANDARD
            num_workers: 0

            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]

            custom_tags:
              ResourceClass: SingleNode

            runtime_engine: PHOTON


    # ========================================================
    # MAIN OLIST ETL PIPELINE
    # ========================================================

    olist_etl_pipeline:
      name: olist-etl-pipeline

      parameters:
        - name: processing_start
          default: ""

        - name: processing_end
          default: ""

      tasks:

        # ----------------------------------------------------
        # BRONZE
        # ----------------------------------------------------

        - task_key: bronze_ingestion
          job_cluster_key: olist_cluster

          max_retries: ${var.task_max_retries}
          min_retry_interval_millis: ${var.task_retry_interval_ms}

          notebook_task:
            notebook_path: ./databricks/01_bronze_ingestion.py

            base_parameters:
              storage_account: ${var.storage_account}
              container: ${var.container}
              processing_start: "{{job.parameters.processing_start}}"
              processing_end: "{{job.parameters.processing_end}}"


        # ----------------------------------------------------
        # SILVER
        # ----------------------------------------------------

        - task_key: silver_processing

          depends_on:
            - task_key: bronze_ingestion

          job_cluster_key: olist_cluster

          max_retries: ${var.task_max_retries}
          min_retry_interval_millis: ${var.task_retry_interval_ms}

          notebook_task:
            notebook_path: ./databricks/02_silver_processing.py

            base_parameters:
              storage_account: ${var.storage_account}
              container: ${var.container}
              processing_start: "{{job.parameters.processing_start}}"
              processing_end: "{{job.parameters.processing_end}}"


        # ----------------------------------------------------
        # GOLD
        # ----------------------------------------------------

        - task_key: gold_curation

          depends_on:
            - task_key: silver_processing

          job_cluster_key: olist_cluster

          max_retries: ${var.task_max_retries}
          min_retry_interval_millis: ${var.task_retry_interval_ms}

          notebook_task:
            notebook_path: ./databricks/03_gold.py

            base_parameters:
              storage_account: ${var.storage_account}
              container: ${var.container}


      # ======================================================
      # MAIN PIPELINE COMPUTE
      # ======================================================

      job_clusters:
        - job_cluster_key: olist_cluster

          new_cluster:
            spark_version: 18.x-scala2.13
            node_type_id: Standard_E4ads_v6
            data_security_mode: DATA_SECURITY_MODE_STANDARD
            num_workers: 0

            spark_conf:
              spark.databricks.cluster.profile: singleNode
              spark.master: local[*, 4]

            custom_tags:
              ResourceClass: SingleNode

            runtime_engine: PHOTON


targets:
  prod:
    mode: production

    workspace:
      root_path: /Workspace/Users/anish.dhakal54@gmail.com/.bundle/${bundle.name}/${bundle.target}